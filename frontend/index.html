<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Reviewer | Smart Code Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #0ea5e9;
            --dark: #1e293b;
            --light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light);
            color: var(--dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
        }

        .upload-container {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .upload-container:hover {
            transform: translateY(-4px);
        }

        .drop-zone {
            border: 2px dashed var(--primary);
            border-radius: 0.5rem;
            padding: 3rem;
            margin: 2rem 0;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .drop-zone:hover {
            background: rgba(99, 102, 241, 0.05);
        }

        .drop-zone.dragging {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary-dark);
        }

        .btn {
            background: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .results {
            margin-top: 3rem;
            display: none;
        }

        .results.active {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .score-card {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .score {
            font-size: 3rem;
            font-weight: 600;
            color: var(--primary);
            margin: 1rem 0;
        }

        .progress-bar {
            width: 100%;
            height: 0.5rem;
            background: #e2e8f0;
            border-radius: 1rem;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 1s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">🤖 AI Code Reviewer</div>
            <button class="btn">Documentation</button>
        </header>

        <main>
            <div class="upload-container">
                <h1>Analyze Your Code</h1>
                <p>Drag and drop your code files or click to upload</p>
                
                <div class="drop-zone" id="dropZone">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p>Drop your files here</p>
                </div>

                <button class="btn">Start Analysis</button>
            </div>

            <div class="results" id="results">
                <div class="score-card">
                    <h2>Code Quality Score</h2>
                    <div class="score">0</div>
                    <div class="progress-bar">
                        <div class="progress" id="progressBar"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const results = document.getElementById('results');
        const progressBar = document.getElementById('progressBar');
        const score = document.querySelector('.score');

        // Drag and drop handlers
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragging');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragging');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragging');
            const files = e.dataTransfer.files;
            handleFiles(files);
        });

        function handleFiles(files) {
            // Simulate file processing and analysis
            results.classList.add('active');
            
            let currentScore = 0;
            const targetScore = 85; // Example score

            const scoreInterval = setInterval(() => {
                if (currentScore < targetScore) {
                    currentScore++;
                    score.textContent = currentScore;
                    progressBar.style.width = `${currentScore}%`;
                } else {
                    clearInterval(scoreInterval);
                }
            }, 20);
        }
    </script>
</body>
</html>
