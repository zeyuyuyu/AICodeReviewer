<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroPilot Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #0b1c3d;
            --accent: #ff124f;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b1c3d 0%, #1a2c4e 100%);
            color: white;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 3rem;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
        }

        .metric {
            text-align: center;
        }

        .metric h3 {
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 75%;
            animation: fillProgress 2s ease-out;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            }
            to {
                text-shadow: 0 0 20px rgba(0, 242, 255, 0.8);
            }
        }

        @keyframes fillProgress {
            from { width: 0; }
            to { width: 75%; }
        }

        .control-panel {
            margin-top: 3rem;
            text-align: center;
        }

        .btn {
            background: var(--primary);
            border: none;
            padding: 1rem 2rem;
            border-radius: 25px;
            color: var(--secondary);
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--accent);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>NeuroPilot Dashboard</h1>
        </header>

        <div class="dashboard-grid">
            <div class="dashboard-card">
                <div class="metric">
                    <h3>Neural Processing</h3>
                    <div class="metric-value">98.7%</div>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="metric">
                    <h3>System Health</h3>
                    <div class="metric-value">Optimal</div>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="metric">
                    <h3>Active Connections</h3>
                    <div class="metric-value">1,247</div>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <button class="btn" onclick="toggleSystem()">Initialize System</button>
        </div>
    </div>

    <script>
        let systemActive = false;

        function toggleSystem() {
            const btn = document.querySelector('.btn');
            systemActive = !systemActive;
            
            if (systemActive) {
                btn.textContent = 'Shutdown System';
                btn.style.background = 'var(--accent)';
                startMetricUpdates();
            } else {
                btn.textContent = 'Initialize System';
                btn.style.background = 'var(--primary)';
                stopMetricUpdates();
            }
        }

        function updateMetrics() {
            const values = document.querySelectorAll('.metric-value');
            values.forEach(value => {
                if (value.textContent.includes('%')) {
                    const current = parseFloat(value.textContent);
                    value.textContent = (current + (Math.random() * 2 - 1)).toFixed(1) + '%';
                } else if (value.textContent.includes(',')) {
                    const current = parseInt(value.textContent.replace(',', ''));
                    value.textContent = (current + Math.floor(Math.random() * 100 - 50)).toLocaleString();
                }
            });
        }

        let updateInterval;

        function startMetricUpdates() {
            updateInterval = setInterval(updateMetrics, 2000);
        }

        function stopMetricUpdates() {
            clearInterval(updateInterval);
        }
    </script>
</body>
</html>
