<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Reviewer - Level Up Your Code!</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto px-4 py-8">
        <!-- Gamification Header -->
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <img src="https://api.dicebear.com/6.x/avataaars/svg?seed=user123" class="w-12 h-12 rounded-full border-2 border-yellow-400">
                    <span class="absolute -top-1 -right-1 bg-green-500 rounded-full w-4 h-4"></span>
                </div>
                <div>
                    <h3 class="text-xl font-bold">Level 12 Code Master</h3>
                    <div class="flex items-center">
                        <div class="w-48 h-2 bg-gray-700 rounded-full">
                            <div class="w-3/4 h-2 bg-blue-500 rounded-full animate__animated animate__pulse animate__infinite"></div>
                        </div>
                        <span class="ml-2 text-sm">750/1000 XP</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-center">
                    <span class="text-yellow-400 text-2xl font-bold">🔥 23</span>
                    <p class="text-xs">Day Streak</p>
                </div>
                <div class="text-center">
                    <span class="text-purple-400 text-2xl font-bold">⭐ 145</span>
                    <p class="text-xs">Karma Points</p>
                </div>
            </div>
        </div>

        <!-- Main Review Area -->
        <div class="bg-gray-800 rounded-lg p-6 mb-8">
            <textarea id="code-input" class="w-full h-64 bg-gray-700 rounded p-4 mb-4 font-mono" placeholder="Paste your code here..."></textarea>
            <div class="flex justify-between items-center">
                <button onclick="reviewCode()" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-lg font-bold animate__animated animate__pulse animate__infinite">Review My Code 🚀</button>
                <span class="text-gray-400">Earn 50 XP per review!</span>
            </div>
        </div>

        <!-- Social Feed -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-gray-800 rounded-lg p-6">
                <h3 class="text-xl font-bold mb-4">🏆 Leaderboard</h3>
                <div class="space-y-4">
                    <div class="flex items-center justify-between bg-gray-700 p-3 rounded">
                        <div class="flex items-center space-x-3">
                            <span class="text-yellow-400 font-bold">1</span>
                            <img src="https://api.dicebear.com/6.x/avataaars/svg?seed=top1" class="w-8 h-8 rounded-full">
                            <span>CodeNinja</span>
                        </div>
                        <span class="text-blue-400">2,450 XP</span>
                    </div>
                    <!-- More leaderboard entries... -->
                </div>
            </div>
            <div class="bg-gray-800 rounded-lg p-6">
                <h3 class="text-xl font-bold mb-4">🎯 Achievements</h3>
                <div class="grid grid-cols-3 gap-4">
                    <div class="text-center">
                        <div class="w-16 h-16 mx-auto bg-purple-700 rounded-full flex items-center justify-center mb-2">
                            <span class="text-2xl">🎯</span>
                        </div>
                        <p class="text-sm">First Review</p>
                    </div>
                    <div class="text-center opacity-50">
                        <div class="w-16 h-16 mx-auto bg-gray-700 rounded-full flex items-center justify-center mb-2">
                            <span class="text-2xl">⚡</span>
                        </div>
                        <p class="text-sm">10 Day Streak</p>
                    </div>
                    <!-- More achievements... -->
                </div>
            </div>
        </div>
    </div>

    <!-- Social Sharing Modal -->
    <div id="share-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-gray-800 rounded-lg p-6 w-96">
            <h3 class="text-xl font-bold mb-4">🎉 Share Your Achievement!</h3>
            <p class="mb-4">Just earned 50 XP and unlocked "Code Guru" badge!</p>
            <div class="flex space-x-4">
                <button class="flex-1 bg-blue-500 hover:bg-blue-600 py-2 rounded">Twitter</button>
                <button class="flex-1 bg-green-500 hover:bg-green-600 py-2 rounded">LinkedIn</button>
            </div>
        </div>
    </div>

    <script>
        function reviewCode() {
            // Simulate review process
            setTimeout(() => {
                // Show achievement unlock animation
                document.getElementById('share-modal').classList.remove('hidden');
            }, 1500);
        }
    </script>
</body>
</html>
